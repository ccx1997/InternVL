# PetrelOSS Configuration File
# This is a basic configuration for S3-compatible storage

[default]
# S3 endpoint configuration
endpoint = http://localhost:9000
access_key = your_access_key
secret_key = your_secret_key
bucket_name = your_bucket_name

# Connection settings
max_retries = 3
timeout = 30
connect_timeout = 10

# Optional: Use SSL/TLS
use_ssl = false
verify_ssl = true

# Optional: Region settings
region = us-east-1

# Optional: Path style access
path_style = true







